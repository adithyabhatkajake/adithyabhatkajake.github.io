<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="serif" font-size="14">
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold">B(x,y) = 7 + 3x + 3y + 5xy over F₁₁, secret s = 7</text>
  <text x="340" y="44" text-anchor="middle" font-size="13" fill="#555">n = 4 parties, t = 1, symmetric: B(x,y) = B(y,x)</text>

  <!-- Column headers -->
  <text x="175" y="72" text-anchor="middle" font-size="12" fill="#666">y=0</text>
  <text x="245" y="72" text-anchor="middle" font-size="12" fill="#666">y=1</text>
  <text x="315" y="72" text-anchor="middle" font-size="12" fill="#666">y=2</text>
  <text x="385" y="72" text-anchor="middle" font-size="12" fill="#666">y=3</text>
  <text x="455" y="72" text-anchor="middle" font-size="12" fill="#666">y=4</text>

  <!-- Row 0: secret row -->
  <text x="110" y="102" text-anchor="middle" font-size="12" fill="#999">x=0</text>
  <rect x="145" y="82" width="60" height="30" rx="4" fill="#ff6b6b" opacity="0.9"/>
  <text x="175" y="102" text-anchor="middle" fill="white" font-weight="bold" font-size="13">7</text>
  <rect x="215" y="82" width="60" height="30" rx="4" fill="#ffd9d9" opacity="0.4" stroke="#ddd"/>
  <text x="245" y="102" text-anchor="middle" fill="#999" font-size="12">10</text>
  <rect x="285" y="82" width="60" height="30" rx="4" fill="#ffd9d9" opacity="0.4" stroke="#ddd"/>
  <text x="315" y="102" text-anchor="middle" fill="#999" font-size="12">2</text>
  <rect x="355" y="82" width="60" height="30" rx="4" fill="#ffd9d9" opacity="0.4" stroke="#ddd"/>
  <text x="385" y="102" text-anchor="middle" fill="#999" font-size="12">5</text>
  <rect x="425" y="82" width="60" height="30" rx="4" fill="#ffd9d9" opacity="0.4" stroke="#ddd"/>
  <text x="455" y="102" text-anchor="middle" fill="#999" font-size="12">8</text>
  <text x="520" y="102" font-size="11" fill="#999" font-style="italic">secret row (nobody has this)</text>

  <!-- Row 1: P1 yellow -->
  <text x="110" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">P₁ (x=1)</text>
  <rect x="145" y="126" width="60" height="30" rx="4" fill="#ffd93d" opacity="0.85"/>
  <text x="175" y="146" text-anchor="middle" font-size="13" font-weight="bold">10</text>
  <rect x="215" y="126" width="60" height="30" rx="4" fill="#ffd93d" opacity="0.6"/>
  <text x="245" y="146" text-anchor="middle" font-size="13">7</text>
  <rect x="285" y="126" width="60" height="30" rx="4" fill="#ffd93d" opacity="0.6"/>
  <text x="315" y="146" text-anchor="middle" font-size="13">4</text>
  <rect x="355" y="126" width="60" height="30" rx="4" fill="#ffd93d" opacity="0.6"/>
  <text x="385" y="146" text-anchor="middle" font-size="13">1</text>
  <rect x="425" y="126" width="60" height="30" rx="4" fill="#ffd93d" opacity="0.6"/>
  <text x="455" y="146" text-anchor="middle" font-size="13">9</text>
  <text x="540" y="146" font-size="11" fill="#b8860b" font-style="italic">f₁(y) = 10 + 8y</text>

  <!-- Row 2: P2 green -->
  <text x="110" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d8a4e">P₂ (x=2)</text>
  <rect x="145" y="170" width="60" height="30" rx="4" fill="#6bcb77" opacity="0.75"/>
  <text x="175" y="190" text-anchor="middle" font-size="13" font-weight="bold">2</text>
  <rect x="215" y="170" width="60" height="30" rx="4" fill="#6bcb77" opacity="0.5"/>
  <text x="245" y="190" text-anchor="middle" font-size="13">4</text>
  <rect x="285" y="170" width="60" height="30" rx="4" fill="#6bcb77" opacity="0.5"/>
  <text x="315" y="190" text-anchor="middle" font-size="13">6</text>
  <rect x="355" y="170" width="60" height="30" rx="4" fill="#6bcb77" opacity="0.5"/>
  <text x="385" y="190" text-anchor="middle" font-size="13">8</text>
  <rect x="425" y="170" width="60" height="30" rx="4" fill="#6bcb77" opacity="0.5"/>
  <text x="455" y="190" text-anchor="middle" font-size="13">10</text>
  <text x="540" y="190" font-size="11" fill="#2d8a4e" font-style="italic">f₂(y) = 2 + 2y</text>

  <!-- Row 3: P3 blue -->
  <text x="110" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">P₃ (x=3)</text>
  <rect x="145" y="214" width="60" height="30" rx="4" fill="#4d96ff" opacity="0.7"/>
  <text x="175" y="234" text-anchor="middle" font-size="13" font-weight="bold">5</text>
  <rect x="215" y="214" width="60" height="30" rx="4" fill="#4d96ff" opacity="0.5"/>
  <text x="245" y="234" text-anchor="middle" font-size="13">1</text>
  <rect x="285" y="214" width="60" height="30" rx="4" fill="#4d96ff" opacity="0.5"/>
  <text x="315" y="234" text-anchor="middle" font-size="13">8</text>
  <rect x="355" y="214" width="60" height="30" rx="4" fill="#4d96ff" opacity="0.5"/>
  <text x="385" y="234" text-anchor="middle" font-size="13">4</text>
  <rect x="425" y="214" width="60" height="30" rx="4" fill="#4d96ff" opacity="0.5"/>
  <text x="455" y="234" text-anchor="middle" font-size="13">0</text>
  <text x="540" y="234" font-size="11" fill="#2563eb" font-style="italic">f₃(y) = 5 + 7y</text>

  <!-- Row 4: P4 purple -->
  <text x="110" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">P₄ (x=4)</text>
  <rect x="145" y="258" width="60" height="30" rx="4" fill="#c77dff" opacity="0.7"/>
  <text x="175" y="278" text-anchor="middle" font-size="13" font-weight="bold">8</text>
  <rect x="215" y="258" width="60" height="30" rx="4" fill="#c77dff" opacity="0.5"/>
  <text x="245" y="278" text-anchor="middle" font-size="13">9</text>
  <rect x="285" y="258" width="60" height="30" rx="4" fill="#c77dff" opacity="0.5"/>
  <text x="315" y="278" text-anchor="middle" font-size="13">10</text>
  <rect x="355" y="258" width="60" height="30" rx="4" fill="#c77dff" opacity="0.5"/>
  <text x="385" y="278" text-anchor="middle" font-size="13">0</text>
  <rect x="425" y="258" width="60" height="30" rx="4" fill="#c77dff" opacity="0.5"/>
  <text x="455" y="278" text-anchor="middle" font-size="13">1</text>
  <text x="540" y="278" font-size="11" fill="#7c3aed" font-style="italic">f₄(y) = 8 + y</text>

  <!-- Symmetry highlight: B(1,2)=4 and B(2,1)=4 -->
  <rect x="285" y="126" width="60" height="30" rx="4" fill="none" stroke="#e63946" stroke-width="2.5"/>
  <rect x="215" y="170" width="60" height="30" rx="4" fill="none" stroke="#e63946" stroke-width="2.5"/>
  <path d="M 300 156 C 280 163, 265 163, 260 170" stroke="#e63946" stroke-width="1.5" fill="none"/>
  <text x="262" y="167" text-anchor="middle" font-size="10" fill="#e63946" font-weight="bold">both = 4</text>

  <!-- Column y=0 highlight for reconstruction -->
  <rect x="143" y="124" width="64" height="166" rx="4" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="175" y="308" text-anchor="middle" font-size="11" fill="#e63946" font-weight="bold">y=0 column</text>
  <text x="175" y="322" text-anchor="middle" font-size="11" fill="#e63946">→ reconstruct s</text>

  <!-- Legend -->
  <rect x="30" y="348" width="620" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="50" y="370" font-size="12" font-weight="bold">Cross-check example:</text>
  <text x="50" y="390" font-size="12">P₁ sends B(1,2) = f₁(2) = 10 + 8·2 = 26 ≡ 4 (mod 11) to P₂. P₂ checks: f₂(1) = 2 + 2·1 = 4. Match ✓</text>
  <text x="50" y="406" font-size="12">This works for every pair because B(x,y) = B(y,x), so B(i,j) = B(j,i) always.</text>
</svg>