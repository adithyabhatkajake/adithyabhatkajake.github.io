<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="16" font-weight="bold">Reconstruction from P₁ and P₃ (any t+1 = 2 parties suffice)</text>

  <!-- Step 1: reveal y=0 -->
  <rect x="20" y="45" width="200" height="90" rx="6" fill="#fff8e1" stroke="#ffc107"/>
  <text x="120" y="66" text-anchor="middle" font-weight="bold" font-size="13" fill="#f57f17">Reveal y=0 values</text>
  <rect x="40" y="78" width="70" height="24" rx="3" fill="#ffd93d" opacity="0.85"/>
  <text x="75" y="95" text-anchor="middle" font-size="12">P₁: (1, 10)</text>
  <rect x="130" y="78" width="70" height="24" rx="3" fill="#4d96ff" opacity="0.7"/>
  <text x="165" y="95" text-anchor="middle" font-size="12" fill="white">P₃: (3, 5)</text>
  <text x="120" y="128" text-anchor="middle" font-size="11" fill="#888">f₁(0)=10, f₃(0)=5</text>

  <line x1="225" y1="88" x2="255" y2="88" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: interpolate -->
  <rect x="260" y="45" width="210" height="90" rx="6" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="365" y="66" text-anchor="middle" font-weight="bold" font-size="13" fill="#1565c0">Lagrange interpolation</text>
  <text x="365" y="86" text-anchor="middle" font-size="12">B(x,0) has degree t = 1</text>
  <text x="365" y="104" text-anchor="middle" font-size="12">2 points determine it uniquely</text>
  <text x="365" y="128" text-anchor="middle" font-size="11" fill="#888">→ B(x,0) = 3x + 7</text>

  <line x1="475" y1="88" x2="505" y2="88" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: evaluate -->
  <rect x="510" y="55" width="170" height="60" rx="6" fill="#ff6b6b" opacity="0.9"/>
  <text x="595" y="80" text-anchor="middle" fill="white" font-weight="bold" font-size="15">B(0,0) = 7 = s</text>
  <text x="595" y="100" text-anchor="middle" fill="white" font-size="12">set x = 0</text>

  <!-- Detailed computation -->
  <rect x="20" y="155" width="660" height="210" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="350" y="178" text-anchor="middle" font-weight="bold" font-size="14">Step-by-step computation in F₁₁</text>

  <text x="40" y="205" font-size="13">Lagrange formula for 2 points (x₁, y₁) = (1, 10) and (x₂, y₂) = (3, 5):</text>

  <text x="40" y="232" font-size="13" font-style="italic">B(x, 0) = y₁ · (x − x₂)/(x₁ − x₂) + y₂ · (x − x₁)/(x₂ − x₁)</text>

  <text x="40" y="259" font-size="13">= 10 · (x − 3)/(1 − 3) + 5 · (x − 1)/(3 − 1)</text>

  <text x="40" y="282" font-size="13">= 10 · (x − 3) · (−2)⁻¹ + 5 · (x − 1) · 2⁻¹</text>

  <text x="40" y="305" font-size="13">In F₁₁: (−2)⁻¹ = 9⁻¹ = 5 (since 9·5 = 45 ≡ 1) and 2⁻¹ = 6 (since 2·6 = 12 ≡ 1)</text>

  <text x="40" y="328" font-size="13">= 10·5·(x−3) + 5·6·(x−1) = 50(x−3) + 30(x−1) ≡ 6(x−3) + 8(x−1) (mod 11)</text>

  <text x="40" y="351" font-size="13">= 6x − 18 + 8x − 8 = 14x − 26 ≡ 3x + 7 (mod 11)</text>

  <rect x="470" y="337" width="195" height="24" rx="4" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b"/>
  <text x="567" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">x = 0: B(0,0) = 7 = s ✓</text>
</svg>